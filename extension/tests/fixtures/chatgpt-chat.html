<!DOCTYPE html>
<!-- 手工构造的 chatgpt.com 会话 DOM 快照（按 2026-07 结构事实精简）。
     页面改版时：用 DevTools 复制真实会话的最小结构替换本文件，再跑 npm test。 -->
<html>
<body>
<main>
  <article data-turn="user" data-turn-id="turn-u-1" data-testid="conversation-turn-1">
    <div data-message-author-role="user">
      <div class="whitespace-pre-wrap">TCP 三次握手里，第三次的 ACK 丢了，服务端会怎么处理？</div>
    </div>
  </article>

  <article data-turn="assistant" data-turn-id="turn-a-2" data-testid="conversation-turn-2">
    <div data-message-author-role="assistant">
      <div class="markdown">
        <p>服务端此时停留在 SYN_RECV 状态，会超时重传 SYN+ACK 报文。</p>
        <pre><div class="text-token-text-primary">bash</div><button>Copy</button><code>sysctl net.ipv4.tcp_synack_retries</code></pre>
      </div>
    </div>
  </article>

  <article data-turn="user" data-turn-id="turn-u-3" data-testid="conversation-turn-3">
    <div data-message-author-role="user">
      <div class="whitespace-pre-wrap">写一个 Python 去重函数。</div>
    </div>
  </article>

  <article data-turn="assistant" data-turn-id="turn-a-4" data-testid="conversation-turn-4">
    <div data-message-author-role="assistant">
      <div class="markdown">
        <p>可以用 dict.fromkeys 保序去重。</p>
      </div>
    </div>
  </article>
</main>
</body>
</html>
