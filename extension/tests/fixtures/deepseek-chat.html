<!DOCTYPE html>
<!-- 手工构造的 chat.deepseek.com 会话 DOM 快照（按调研报告 §2 的结构事实精简：

     页面改版时：用 DevTools 复制真实会话的最小结构替换本文件，再跑 npm test。 -->
<html>
<body>
<div class="_765a5cd ds-scroll-area">
  <div class="ds-virtual-list-visible-items">
    <div class="_9663006" data-virtual-list-item-key="0">
      <div class="d29f3d7d ds-message _63c77b1">

      </div>

        </div>
      </div>
    </div>

    <div class="_9663006" data-virtual-list-item-key="1">
      <div class="d29f3d7d ds-message _63c77b1">

      <div class="_11d6b3a">
        <div class="ds-markdown ds-assistant-message-main-content">

        </div>
      </div>
    </div>
  </div>
</div>
